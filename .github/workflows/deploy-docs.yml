name: Deploy docs to GitHub Pages

on:
  # Déploie à chaque push sur main qui touche la doc (ou le workflow lui-même).
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      - ".github/workflows/deploy-docs.yml"
  # Permet de relancer manuellement depuis l'onglet Actions.
  workflow_dispatch:

# Permissions minimales requises par le déploiement Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Une seule exécution de déploiement à la fois ; n'annule pas un run en cours
# pour laisser un déploiement se terminer proprement.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      # Installe toutes les dépendances du monorepo (yarn workspaces).
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build docs
        run: yarn docs:build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
