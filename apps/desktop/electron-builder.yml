appId: com.ctxfirst.desktop
productName: CtxFirst
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - plugins-builtin/**/*
  - package.json
asarUnpack:
  - resources/**
linux:
  target:
    - AppImage
    - deb
    - rpm
  category: Utility
  icon: build/icons
mac:
  target:
    - dmg
  category: public.app-category.developer-tools
  icon: build/icon.icns
win:
  target:
    - nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
